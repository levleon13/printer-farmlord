<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark"><title>Sign in · Printing Farmlord</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#0e1618;color:#edf3f2;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:100%;max-width:380px;padding:28px;background:#1b2528;border:1px solid #344448;border-radius:16px}h1{font-size:25px;margin:0 0 8px}.fl-mark{display:flex;flex-direction:column;line-height:1;gap:5px}.fl-name{font-weight:800;letter-spacing:.06em;font-size:.82em;color:var(--fg,#eef1f5);white-space:nowrap}.fl-name em{font-style:normal;background:linear-gradient(100deg,#ffe08a 0%,#f5c542 40%,#e9932a 75%,#e23b3b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px #f5c54226}.fl-by{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#a1aab8}.fl-by::before{content:"";width:16px;height:1px;background:linear-gradient(90deg,#e23b3b,#f5c542)}p{color:#adbec0;font-size:14px;line-height:1.5;margin:0 0 24px}label{display:block;font-size:14px;margin-bottom:8px}input{display:block;width:100%;font:inherit;padding:13px 14px;color:#edf3f2;background:#0e1618;border:1px solid #53666b;border-radius:9px}input:focus{outline:2px solid #ace4d0;outline-offset:2px}button{width:100%;min-height:48px;margin-top:18px;border:0;border-radius:9px;background:#ace4d0;color:#102721;font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}button:focus-visible{outline:2px solid #edf3f2;outline-offset:3px}.error{color:#ffaaa6;margin:16px 0 0}</style></head>
<body><main><h1 style="display:flex;align-items:center;gap:10px">__FARMLORD_LOGO__<span class="fl-mark"><b class="fl-name">PRINTING <em>FARMLORD</em></b><small class="fl-by">by Lev Leon</small></span></h1><p>Sign in to your printers.</p>
<form method="post" action="/login" autocomplete="on">
__NAMEFIELD__
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
__ERROR__<button type="submit">Sign in</button></form></main></body></html>
