name: Verify portable bundle
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for identifying data
        run: python3 scripts/privacy_check.py
      - name: Check Python syntax
        run: python3 -m py_compile ams_tracker.py fix_bridge_anchor.py scripts/*.py farmlord/*.py tests/*.py
      - name: Check the app imports
        run: AMS_TRACKER_DIR=$(mktemp -d) python3 -c "import ams_tracker"
